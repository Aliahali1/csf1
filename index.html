<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مغامرة المهارات الرقمية</title>
<meta name="description" content="لعبة مراجعة تفاعلية لدروس المهارات الرقمية للصف الثالث المتوسط — إعداد المعلمة عالية اليامي">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap">
<link rel="preload" as="image" href="img/hero.webp" type="image/webp">
<link rel="stylesheet" href="css/style.css?v=1.7.6">
<link rel="stylesheet" href="css/home.css?v=1.7.6">
<link rel="stylesheet" href="css/scenes.css?v=1.7.6">
<link rel="stylesheet" href="css/a11y.css?v=1.7.6">
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="#" id="brandLink"><span id="brandIcon"></span><span><b>مغامرة المهارات الرقمية</b><small>رحلة إتقان الدروس الأربعة</small></span></a>
    <div class="top-stats" id="topStats"></div>
    <button class="teacher-btn" id="teacherBtn" type="button">🔐 دخول المعلمة</button>
    <button class="sound-btn" id="soundBtn" type="button" aria-label="الأصوات">🔊</button>
  </div>
</header>
<main>
  <div class="wrap" id="app" aria-live="polite"></div>
</main>
<footer class="foot">
  <div class="foot-in">
    <div class="author">إعداد المعلمة: <span>عالية اليامي</span></div>
    <div>المهارات الرقمية · الصف الثالث المتوسط · <button class="linkish" type="button" id="teacherLink">دخول المعلمة</button></div>
  </div>
</footer>
<div class="drawer-bg" id="drawerBg" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" hidden></aside>

<script src="js/config.js?v=1.7.6"></script>
<script src="js/icons.js?v=1.7.6"></script>
<script src="js/questions.js?v=1.7.6"></script>
<script src="js/review.js?v=1.7.6"></script>
<script src="js/rules.js?v=1.7.6"></script>
<script src="js/forms.js?v=1.7.6"></script>
<script src="js/storage.js?v=1.7.6"></script>
<script src="js/tracker.js?v=1.7.6"></script>
<script src="js/quiz-engine.js?v=1.7.6"></script>
<script src="js/auth.js?v=1.7.6"></script>
<script src="js/fx.js?v=1.7.6"></script>
<script src="js/a11y.js"></script>
<script src="js/lesson-viewer.js?v=1.7.6"></script>
<script>
  document.getElementById('brandIcon').innerHTML = MDQ.icons.compass;
  document.getElementById('brandLink').addEventListener('click', function (e) {
    e.preventDefault();
    MDQ.ui && MDQ.ui.go(MDQ.store.get(MDQ.KEYS.session, null) ? 'map' : 'welcome');
  });
  document.getElementById('teacherLink').addEventListener('click', function () { MDQ.auth.open(); });
</script>
<script src="js/app.js?v=1.7.6"></script>
</body>
</html>
